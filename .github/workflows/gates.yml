# YTF-STP-001 §1의 언어 게이트를 PR마다 자동 실행한다.
# 수동 1회 실행에 의존한 결과 build.sh가 2주간 깨진 채 방치된 것이 도입 근거다
# (YTF-VER-001 VER-M-21).
name: gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go (Interface/golang)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Interface/golang
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: Interface/golang/go.mod
          cache-dependency-path: Interface/golang/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race -count=1

  python:
    name: Python (Interface/python)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Interface/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q

  js:
    name: JS (Interface/js)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Interface/js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Interface/js/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  compose:
    name: C++ worker build + Compose E2E
    runs-on: ubuntu-24.04
    needs: [go, python, js]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # 워커는 Ubuntu 24.04 이미지로 빌드된다(CON-04). Dockerfile 경로가 곧 C++ 컴파일 게이트이며,
      # 별도 잡으로 분리하면 러너 간 레이어 캐시가 공유되지 않아 동일 이미지를 두 번 빌드하게 된다
      - name: docker compose build (C++ 워커 컴파일 게이트 포함)
        run: docker compose -f docker/docker-compose.yml build
      - name: stack up
        run: docker compose -f docker/docker-compose.yml up -d
      - name: e2e
        run: bash docker/scripts/e2e_test.sh
      - name: worker logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs --tail 200
      - name: stack down
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
